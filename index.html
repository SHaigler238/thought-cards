<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Thought Cards"><title>Thought Cards</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24282e;background:#f6f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:24px 16px 75px}h1{font-size:26px;margin:0 0 6px}.sub{color:#74777c;font-size:14px;margin:0 0 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.count,.hint{font-size:12px;color:#74777c}.card,.topic{background:white;border:1px solid #e6e3db;border-radius:14px;padding:15px;margin:11px 0;box-shadow:0 2px 5px #00000005}.card textarea{flex:1;min-width:0;width:100%;border:0;outline:0;font:16px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;resize:none;min-height:24px;height:24px;padding:2px 0;color:inherit;background:transparent;overflow:hidden}.card{display:flex;align-items:center;gap:7px;padding:7px 8px;margin:7px 0;border-radius:10px}.card .controls{display:flex;flex:0 0 auto;gap:3px;flex-wrap:nowrap;margin:0}.card .controls button{font-size:12px;padding:7px 5px;border-radius:7px;white-space:nowrap}@media(max-width:370px){.card{gap:4px;padding:6px}.card .controls{gap:2px}.card .controls button{padding:7px 4px;font-size:11px}}.controls,.actions,.footer{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}button{border:1px solid #d9d9d7;border-radius:9px;background:#fff;color:#343a40;padding:9px 12px;font-size:14px;cursor:pointer}button:disabled{opacity:.3}.danger{color:#a33333}.primary{background:#263d52;color:white;border-color:#263d52}.add{border:1px dashed #bbb9b2;border-radius:14px;padding:15px;margin-top:20px}.add textarea,.add input{width:100%;border:1px solid #dedbd5;border-radius:9px;padding:12px;margin-top:8px;font:16px/1.5 -apple-system,sans-serif}.add textarea{min-height:82px}select{padding:9px;border:1px solid #d9d9d7;border-radius:9px;background:white;max-width:180px}.hint{margin-top:12px;line-height:1.5}input[type=file]{display:none}.topic{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:17px;gap:12px}.topic small{display:block;color:#74777c;font-size:12px;margin-top:5px}.topic .arrow{color:#74777c}.back{margin-bottom:16px}.empty{color:#74777c;font-size:14px;padding:14px 0}
</style></head><body><main class="wrap"><div id="home"><div class="top"><h1>My Thoughts</h1><span class="count" id="topiccount"></span></div><p class="sub">Choose a thought to see and arrange its notes.</p><section id="topics"></section><section class="add"><strong>New thought</strong><input id="topicname" maxlength="100" placeholder="Name this thought..." aria-label="Thought name"><div class="actions"><button id="create" class="primary">+ Create thought</button></div></section></div><div id="detail" hidden><button class="back" id="back">← All thoughts</button><div class="top"><h1 id="heading"></h1><span id="count" class="count"></span></div><p class="sub">Write, edit, insert, and rearrange your notes.</p><section id="cards"></section><section class="add"><strong>New note</strong><textarea id="new" placeholder="Write your next note here..."></textarea><div class="actions"><label for="pos">Place note</label><select id="pos"></select><button class="primary" id="add">+ Add note</button></div></section><div class="actions"><button id="rename">Rename thought</button><button class="danger" id="deleteTopic">Delete thought</button></div></div><div class="footer"><button id="export">Export backup</button><button id="import">Import backup</button><input type="file" id="file" accept="application/json,.json"></div><p class="hint" id="status">Your notes are stored on this device. Export a backup regularly.</p></main><script>
(()=>{'use strict';const oldKey='thoughtcards-v1',key='thoughtcards-v2',$=id=>document.getElementById(id);let data={topics:[]},active=null;const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);try{const stored=JSON.parse(localStorage.getItem(key)||'null');if(stored&&Array.isArray(stored.topics))data={topics:stored.topics.filter(t=>t&&typeof t.name==='string'&&Array.isArray(t.notes)).map(t=>({id:String(t.id||uid()),name:t.name,notes:t.notes.filter(n=>typeof n==='string')}))};else{const old=JSON.parse(localStorage.getItem(oldKey)||'[]');if(Array.isArray(old)&&old.length)data.topics.push({id:uid(),name:'My Original Thoughts',notes:old.filter(n=>typeof n==='string')})}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='Saved on this device. Export a backup regularly.'}catch(e){$('status').textContent='Unable to save on this device. Export a backup before closing.'}}function topic(){return data.topics.find(t=>t.id===active)}function showHome(){active=null;$('home').hidden=false;$('detail').hidden=true;renderHome()}function openTopic(id){active=id;$('home').hidden=true;$('detail').hidden=false;renderNotes();window.scrollTo(0,0)}function renderHome(){const root=$('topics');root.replaceChildren();$('topiccount').textContent=data.topics.length+' thoughts';if(!data.topics.length){const p=document.createElement('p');p.className='empty';p.textContent='No thoughts yet. Create one below.';root.append(p)}data.topics.forEach(t=>{const b=document.createElement('button');b.className='topic';const left=document.createElement('span'),name=document.createElement('strong'),count=document.createElement('small'),arrow=document.createElement('span');name.textContent=t.name;count.textContent=t.notes.length+' notes';arrow.className='arrow';arrow.textContent='›';left.append(name,count);b.append(left,arrow);b.onclick=()=>openTopic(t.id);root.append(b)})}function renderNotes(){const t=topic();if(!t){showHome();return}$('heading').textContent=t.name;$('count').textContent=t.notes.length+' notes';const root=$('cards');root.replaceChildren();t.notes.forEach((note,i)=>{const card=document.createElement('div');card.className='card';const ta=document.createElement('textarea');ta.value=note;ta.setAttribute('aria-label','Note '+(i+1));const resize=()=>{ta.style.height='24px';ta.style.height=Math.max(24,ta.scrollHeight)+'px'};ta.addEventListener('input',()=>{resize();t.notes[i]=ta.value;save()});requestAnimationFrame(resize);const bar=document.createElement('div');bar.className='controls';[['↑',()=>move(i,-1),i===0],['↓',()=>move(i,1),i===t.notes.length-1],['Insert below',()=>{$('pos').value=String(i+1);$('new').focus()},false],['Delete',()=>{if(confirm('Delete this note?')){t.notes.splice(i,1);save();renderNotes()}},false]].forEach(([label,fn,disabled])=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;if(label==='Delete')b.className='danger';bar.append(b)});card.append(ta,bar);root.append(card)});const pos=$('pos');pos.replaceChildren();for(let i=0;i<=t.notes.length;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=i===t.notes.length?'At bottom (default)':i===0?'At beginning':'After note '+i;pos.append(opt)}pos.value=String(t.notes.length)}function move(i,d){const t=topic(),j=i+d;[t.notes[i],t.notes[j]]=[t.notes[j],t.notes[i]];save();renderNotes()}$('create').onclick=()=>{const name=$('topicname').value.trim();if(!name)return;const t={id:uid(),name,notes:[]};data.topics.push(t);$('topicname').value='';save();openTopic(t.id)};$('topicname').addEventListener('keydown',e=>{if(e.key==='Enter')$('create').click()});$('back').onclick=showHome;$('add').onclick=()=>{const t=topic(),value=$('new').value.trim();if(!t||!value)return;t.notes.splice(Number($('pos').value),0,value);$('new').value='';save();renderNotes();$('new').focus()};$('rename').onclick=()=>{const t=topic();if(!t)return;const name=prompt('New name for this thought:',t.name);if(name&&name.trim()){t.name=name.trim();save();renderNotes()}};$('deleteTopic').onclick=()=>{const t=topic();if(t&&confirm('Delete "'+t.name+'" and all '+t.notes.length+' notes? This cannot be undone.')){data.topics=data.topics.filter(x=>x.id!==t.id);save();showHome()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Thought Cards',version:2,topics:data.topics},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thought-cards-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());let topics;if(Array.isArray(incoming.topics)&&incoming.topics.every(t=>t&&typeof t.name==='string'&&Array.isArray(t.notes)&&t.notes.every(n=>typeof n==='string')))topics=incoming.topics.map(t=>({id:uid(),name:t.name,notes:t.notes}));else if(Array.isArray(incoming.thoughts)&&incoming.thoughts.every(n=>typeof n==='string'))topics=[{id:uid(),name:'My Original Thoughts',notes:incoming.thoughts}];else throw Error('Invalid backup');if(confirm('Replace all current thoughts with this backup?')){data={topics};save();showHome()}}catch(err){alert('This does not look like a valid Thought Cards backup.')}e.target.value=''};save();showHome()})();
</script></body></html>
