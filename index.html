<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thought Cards</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24282e;background:#f6f5f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:24px 16px 70px}h1{font-size:27px;margin:0 0 6px}.sub{color:#74777c;font-size:14px;margin:0 0 22px}.top{display:flex;align-items:center;justify-content:space-between}.count{font-size:12px;color:#74777c}.card{background:white;border:1px solid #e6e3db;border-radius:14px;padding:15px;margin:11px 0;box-shadow:0 2px 5px #00000005}.card textarea{width:100%;border:0;outline:0;font:16px/1.5 inherit;font-family:inherit;resize:vertical;min-height:58px;color:inherit;background:transparent}.controls{display:flex;gap:7px;justify-content:flex-end;margin-top:7px}button{border:1px solid #d9d9d7;border-radius:9px;background:#fff;color:#343a40;padding:9px 12px;font-size:14px;cursor:pointer}button:disabled{opacity:.3}.danger{color:#a33333}.add{border:1px dashed #bbb9b2;border-radius:14px;padding:15px;margin-top:20px}.add textarea{width:100%;border:1px solid #dedbd5;border-radius:9px;padding:12px;min-height:82px;font:16px/1.5 -apple-system,sans-serif}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.primary{background:#263d52;color:white;border-color:#263d52}select{padding:9px;border:1px solid #d9d9d7;border-radius:9px;background:white;max-width:150px}.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.hint{font-size:12px;color:#767676;margin-top:12px;line-height:1.5}input[type=file]{display:none}</style></head><body><main class="wrap"><div class="top"><h1>My Thought Cards</h1><span id="count" class="count"></span></div><p class="sub">One thought at a time. Insert, edit, and rearrange freely.</p><section id="cards"></section><section class="add"><strong>New thought</strong><textarea id="new" placeholder="Write your next thought here..."></textarea><div class="actions"><label for="pos">Insert after</label><select id="pos"></select><button class="primary" id="add">+ Add thought</button></div></section><div class="footer"><button id="export">Export backup</button><button id="import">Import backup</button><input type="file" id="file" accept="application/json,.json"></div><p class="hint" id="status">Saves automatically where browser storage is available. Export backups regularly, especially when opening a local HTML file on iPhone.</p></main><script>(()=>{'use strict';const key='thoughtcards-v1';const $=id=>document.getElementById(id);let notes=[];try{const v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))notes=v.filter(x=>typeof x==='string')}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(notes));$('status').textContent='Saved on this browser. Export a backup regularly.'}catch(e){$('status').textContent='Browser storage unavailable. Export a backup before closing.'}}function render(){const root=$('cards');root.replaceChildren();$('count').textContent=notes.length+' thoughts';notes.forEach((t,i)=>{const card=document.createElement('div');card.className='card';const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('aria-label','Thought '+(i+1));ta.addEventListener('input',()=>{notes[i]=ta.value;save()});const bar=document.createElement('div');bar.className='controls';const actions=[['↑',()=>move(i,-1),i===0],['↓',()=>move(i,1),i===notes.length-1],['Insert below',()=>{$('pos').value=String(i+1);$('new').focus()},false],['Delete',()=>{if(confirm('Delete this thought?')){notes.splice(i,1);save();render()}},false]];actions.forEach(([label,fn,disabled])=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;if(label==='Delete')b.className='danger';bar.append(b)});card.append(ta,bar);root.append(card)});const prev=$('pos').value;const pos=$('pos');pos.replaceChildren();for(let i=0;i<=notes.length;i++){const opt=document.createElement('option');opt.value=i;opt.textContent=i===0?'At beginning':'Thought '+i;pos.append(opt)}pos.value=prev!==''&&Number(prev)<=notes.length?prev:String(notes.length)}function move(i,d){const j=i+d;[notes[i],notes[j]]=[notes[j],notes[i]];save();render()}$('add').onclick=()=>{const value=$('new').value.trim();if(!value)return;notes.splice(Number($('pos').value),0,value);$('new').value='';save();render();$('new').focus()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Thought Cards',version:1,thoughts:notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='thought-cards-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.thoughts)||!data.thoughts.every(x=>typeof x==='string'))throw Error('Invalid backup');if(confirm('Replace current thoughts with this backup?')){notes=data.thoughts;save();render()}}catch(e){alert('This does not look like a valid Thought Cards backup.')}e.target.value=''};render()})();</script></body></html>
